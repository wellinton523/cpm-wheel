modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="cpmwheel_logo.png"
authors="${mod_authors}"
description='''${mod_description}'''
# client-side only: servers do not need it
displayTest="IGNORE_ALL_VERSION"
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="cpm"
    mandatory=false
    versionRange="[0.6.0,)"
    ordering="AFTER"
    side="CLIENT"
