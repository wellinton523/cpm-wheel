modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Zeraph"
description='''Roda radial para organizar e tocar as animacoes do Customizable Player Models.'''
displayTest="IGNORE_ALL_VERSION"
[[mixins]]
config="cpmwheel.mixins.json"
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="cpm"
    type="optional"
    versionRange="[0.6.0,)"
    ordering="AFTER"
    side="CLIENT"
